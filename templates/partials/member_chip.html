<div class="member-chip class-{{ m.class_slug }} {% if m.strategy_note %}has-strategy-note{% endif %}"
     draggable="true"
     data-member-id="{{ m.id }}"
     data-strategy-note="{{ m.strategy_note|default:'' }}"
     ondragstart="dragMember(event)"
     ondragend="dragEnd(event)">

  <div class="chip-main">
    <div class="chip-topline">
      <div class="chip-name" title="{{ m.display_name }}">{{ m.display_name }}</div>

      {% if m.strategy_note %}
        <span class="chip-note-indicator" title="{{ m.strategy_note }}">Note</span>
      {% endif %}

      {% if editable_note %}
      <button type="button"
              class="chip-note-btn"
              title="Sửa ghi chú skill/chiến thuật cá nhân"
              onclick="editStrategyNote(event, '{{ m.id }}')">
        Sửa
      </button>
      {% endif %}
    </div>

    {% if m.class_label %}
      <div class="chip-meta">{{ m.class_label }}</div>
    {% endif %}
  </div>
</div>
