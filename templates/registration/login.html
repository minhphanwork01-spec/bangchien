{% extends "base.html" %}
{% block title %}Đăng nhập Leader – BangCheck{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white text-center py-3">
        <h5 class="mb-0 fw-bold">🔒 Leader Login</h5>
      </div>
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger small">Sai tài khoản hoặc mật khẩu.</div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label class="form-label fw-semibold">Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" name="password" class="form-control" autocomplete="current-password">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-warning btn-lg fw-bold">⚔️ Đăng nhập</button>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mt-3">
      <a href="{% url 'checkin' %}" class="btn btn-link text-muted btn-sm">← Trang báo danh</a>
    </div>
  </div>
</div>
{% endblock %}
